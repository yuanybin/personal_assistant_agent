[project]
name = "personal_assistant_agent"
version = "0.1.0"
description = "Personal assistant agent for developer productivity"
requires-python = ">=3.9,<3.13"
dependencies = [
    "fastapi>=0.100.0,<1.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.25.0",
    "cryptography>=41.0.0",
    "pycryptodome>=3.19.0",
    "defusedxml>=0.7.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
